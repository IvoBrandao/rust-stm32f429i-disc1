[package]
authors = ["Ivo Brandao <IvoBrandao@users.noreply.github.com>"]
edition = "2018"
readme = "README.md"
name = "stm32f429i-disc1"
version = "0.1.0"
categories = [
    "embedded",
    "no-std",
]

[dependencies]
cortex-m                = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt             = { version = "0.7.3"  }
cortex-m-semihosting    = { version = "0.5"  }
panic-halt              = { version = "1.0.0" }
#panic-itm               = { version = "0.4.1" }
#embedded-alloc          = { version = "0.6.0" }
#stm32f4                 = { version = "0.16.0", features = ["stm32f429", "rt"] }
#stm32f4xx-hal           = { version = "0.22.1", features = ["stm32f429"] }
#embedded-hal            = { version = "1.0.0" }

[dependencies.stm32f4]
version = "0.14.0"
features = ["rt", "stm32f429"]

[dependencies.stm32f4xx-hal]
version = "0.11.1"
features = ["rt", "stm32f429"]


[dev-dependencies]
ssd1306     = {version = "0.10.0" }
nb          = {version = "1.1.0"}
panic-halt  = {version = "1.0.0"}
l3gd20      = {version = "0.3.0"}



[[bin]]
name = "stm32f429i-disc1"
test = false
bench = false

[profile.release]
codegen-units = 1 # better optimizations
debug = true # symbols are nice and they don't increase the size on Flash
lto = true # better optimizations


[profile.dev]
debug = true
